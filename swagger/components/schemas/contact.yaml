type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380123456789'
  email:
    description: "Contact's email"
    type: string
    example: 'john.doe@example.com'
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/duw3lfqdi/image/upload/v1760094114/dxkx7hlmaps4ekhbgjed.png
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's parent id"
    type: string
    example: 68def18d1541e02411cb25ce
  createdAt:
    type: string
    format: date-time
    example: '2025-10-10T11:01:55.057+00:00'
  updatedAt:
    type: string
    format: date-time
    example: '2025-10-10T11:01:55.057+00:00'
