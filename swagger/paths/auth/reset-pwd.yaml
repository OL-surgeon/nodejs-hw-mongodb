tags:
  - Auth
summary: Reset password
operationId: resetPassword
description: Resetting the user's password through the email link
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: ../../components/schemas/auth/resetPwd.yaml
responses:
  '200':
    description: Successfully reset user password
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
  '404':
    $ref: ../../components/responses/404-userId.yaml
