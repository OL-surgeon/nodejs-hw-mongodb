tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a contact for an authenticated user. Photos can be added optionally
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            type: string
            example: 'John Doe'
          phoneNumber:
            type: string
            example: '+380123456789'
          email:
            type: string
            example: 'john.doe@example.com'
          photo:
            type: string
            format: binary
            description: Optional contact photo file
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          isFavourite:
            type: boolean
            example: false
responses:
  '201':
    description: Successfully created a contact!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
