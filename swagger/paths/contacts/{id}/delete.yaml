tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Delete an existing contact by ID
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '68e8e7a3d77fb369e1b090bb'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: ../../../components/schemas/updateContact.yaml
responses:
  '204':
    description: 'Successfully deleted contact'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: ../../../components/responses/404.yaml
